# Runs a Website Health Check and emails the PDF to Creative Mushroom for review.
#
# Started automatically by the website's Health Check form (a "repository_dispatch"
# event called health-check), or by hand from the Actions tab using "Run workflow".
#
# Secrets needed (Settings > Secrets and variables > Actions):
#   PSI_API_KEY     Google PageSpeed Insights key
#   SMTP_HOST       e.g. the SiteGround mail server for creativemushroom.co.uk
#   SMTP_PORT       465
#   SMTP_USER       the sending mailbox, e.g. reports@creativemushroom.co.uk
#   SMTP_PASSWORD   that mailbox's password
#   REPORT_TO       where reports go, e.g. hello@creativemushroom.co.uk

name: Health check

on:
  repository_dispatch:
    types: [health-check]
  workflow_dispatch:
    inputs:
      url:
        description: Website address to check
        required: true
      name:
        description: Business name for the report
        required: false
      business_type:
        description: Business type
        type: choice
        options: [other, hospitality]
        default: other
      gbp:
        description: Google Business Profile (leave blank if not checked)
        type: choice
        options: ["", match, mismatch, none, na]
        default: ""
      rank:
        description: Note about their Google position (optional)
        required: false

# One check at a time, so a burst of form entries queues up politely.
concurrency:
  group: health-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Everything from the form arrives as environment variables, never pasted into
      # shell commands, so nothing typed into the form can run as code.
      SITE_URL: ${{ github.event.client_payload.url || inputs.url }}
      BUSINESS_NAME: ${{ github.event.client_payload.name || inputs.name }}
      BUSINESS_TYPE: ${{ github.event.client_payload.business_type || inputs.business_type }}
      GBP: ${{ inputs.gbp }}
      RANK: ${{ inputs.rank }}
      CONTACT_NAME: ${{ github.event.client_payload.contact_name }}
      CONTACT_EMAIL: ${{ github.event.client_payload.contact_email }}
      CONTACT_PHONE: ${{ github.event.client_payload.contact_phone }}
      CONTACT_MESSAGE: ${{ github.event.client_payload.message }}
      ENTRY_ID: ${{ github.event.client_payload.entry_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the tool
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run the check and email the report
        run: python automation/run_and_email.py

      - name: Keep a copy of the report for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
